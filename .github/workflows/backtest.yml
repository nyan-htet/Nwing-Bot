name: backtest
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history (e.g. 8)"
        required: false
        default: "8"
      max_stocks:
        description: "How many STOCKS to test (0 = none, blank = all)"
        required: false
        default: "50"
      include_etfs:
        description: "Include ETFs? yes / no"
        required: false
        default: "yes"
permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy pyyaml
      - name: Run historical backtest
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: |
          python backtest_hist.py "${{ github.event.inputs.years }}" \
                                  "${{ github.event.inputs.max_stocks }}" \
                                  "${{ github.event.inputs.include_etfs }}"
      - name: Publish results
        run: |
          git config user.name swingbot && git config user.email bot@users.noreply.github.com
          git add docs/backtest.json backtest_trades.csv || true
          git commit -m "backtest: update results" || echo "no changes"
          git push
