name: backtest
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history to test (e.g. 8)"
        required: false
        default: "8"
      max_tickers:
        description: "Limit ticker count (blank = all in tickers.csv)"
        required: false
        default: ""
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy pyyaml
      - name: Run historical backtest
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: python backtest_hist.py "${{ github.event.inputs.years }}" ${{ github.event.inputs.max_tickers }}
      - name: Publish results
        run: |
          git config user.name swingbot && git config user.email bot@users.noreply.github.com
          git add docs/backtest.json backtest_trades.csv || true
          git commit -m "backtest: update results" || echo "no changes"
          git push
