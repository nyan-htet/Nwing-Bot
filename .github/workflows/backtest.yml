name: backtest
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history (e.g. 8; capped at 6 for conf mode)"
        required: false
        default: "8"
      mode:
        description: "'strat' = sector-balanced sample, 'conf' = confidence-filtered (see conf_* inputs), a number = max stocks, or blank = all"
        required: false
        default: "strat"
      include_etfs:
        description: "Include ETFs? yes / no (ignored in strat/conf mode)"
        required: false
        default: "yes"
      n_stocks:
        description: "strat mode: how many stocks (spread across sectors)"
        required: false
        default: "30"
      n_etfs:
        description: "strat mode: how many ETFs (spread across exposures)"
        required: false
        default: "10"
      n_baseline:
        description: "strat mode: baseline block (GLD/QQQ/VOO + random)"
        required: false
        default: "10"
      conf_n_stocks:
        description: "conf mode: max stocks (n_stocks + n_etfs must be <=50)"
        required: false
        default: "35"
      conf_n_etfs:
        description: "conf mode: max ETFs"
        required: false
        default: "15"
      conf_position_pct:
        description: "conf mode: equity % per trade, 0.005-0.05 (0.02 = 2%)"
        required: false
        default: "0.02"
      conf_starting_equity:
        description: "conf mode: starting equity"
        required: false
        default: "10000"
      conf_min_confidence:
        description: "conf mode: min news_llm confidence to include a ticker"
        required: false
        default: "60"
      conf_balance_sectors:
        description: "conf mode: spread picks evenly across sectors? yes / no"
        required: false
        default: "yes"
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy pyyaml
      - name: Run historical backtest
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "conf" ]; then
            python backtest_hist.py "${{ github.event.inputs.years }}" conf \
                                    "${{ github.event.inputs.conf_n_stocks }}" \
                                    "${{ github.event.inputs.conf_n_etfs }}" \
                                    "${{ github.event.inputs.conf_position_pct }}" \
                                    "${{ github.event.inputs.conf_starting_equity }}" \
                                    "${{ github.event.inputs.conf_min_confidence }}" \
                                    "${{ github.event.inputs.conf_balance_sectors }}"
          else
            python backtest_hist.py "${{ github.event.inputs.years }}" \
                                    "${{ github.event.inputs.mode }}" \
                                    "${{ github.event.inputs.include_etfs }}" \
                                    "${{ github.event.inputs.n_stocks }}" \
                                    "${{ github.event.inputs.n_etfs }}" \
                                    "${{ github.event.inputs.n_baseline }}"
          fi
      - name: Publish results
        run: |
          git config user.name swingbot && git config user.email bot@users.noreply.github.com
          git add docs/backtest.json backtest_trades.csv || true
          git commit -m "backtest: update results" || echo "no changes"
          git pull --rebase --autostash origin main || true
          git push || (sleep 5 && git pull --rebase --autostash origin main && git push)
