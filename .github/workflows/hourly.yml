name: hourly-scan
on:
  schedule:
    - cron: "15 * * * *"    # every hour at :15 (UTC). GitHub may delay 5-15 min.
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy pyyaml
      - name: Run scan
        env:
          DRY_RUN: "0"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan.py hourly
      - name: Publish dashboard data
        run: |
          git config user.name swingbot && git config user.email bot@users.noreply.github.com
          git add docs/signals.json watchlist.json || true
          git commit -m "scan: update signals" || echo "no changes"
          git push
