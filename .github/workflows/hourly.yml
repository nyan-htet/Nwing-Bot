name: hourly-scan
on:
  schedule:
    - cron: "15 */4 * * 1-5"    # every 4 hours, Mon-Fri only (UTC)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy pyyaml
      - name: Run scan
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          DRY_RUN: "0"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan.py hourly
      - name: Publish dashboard data
        if: always()          # commit the ledger even if the scan step failed,
                              # otherwise alerts are re-sent on the next run
        run: |
          git config user.name swingbot && git config user.email bot@users.noreply.github.com
          git add docs/signals.json watchlist.json signals_log.csv alerted.json || true
          if git diff --cached --quiet; then
            echo "nothing changed — no commit, no Pages rebuild"
            exit 0
          fi
          git commit -m "scan: update signals"
          git pull --rebase --autostash origin main || true
          git push || (sleep 5 && git pull --rebase --autostash origin main && git push)
