name: news-followup

# Optional news risk check on tickers that just alerted.
# Runs after hourly-scan completes, and can also be run manually.
#
# Manual testing:
#   symbols = AAPL,NVDA
#   provider = anthropic | openai | both | auto
#
# NEWS_ENABLED=0 disables the module without changing hourly-scan.

on:
  workflow_run:
    workflows: ["hourly-scan"]
    types: [completed]

  workflow_dispatch:
    inputs:
      symbols:
        description: "Blank = alerts from the last 90 min; e.g. AAPL,NVDA for a manual test"
        required: false
        default: ""
      provider:
        description: "anthropic | openai | both | auto"
        required: false
        default: "auto"

permissions:
  contents: write

jobs:
  news:
    # Do not run automatically when hourly-scan itself failed.
    # Manual runs always execute.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas numpy pyyaml

      - name: News check
        env:
          NEWS_ENABLED: "1"

          # For workflow_run there is no github.event.inputs.provider,
          # so auto is used. For manual runs, the selected provider is used.
          LLM_PROVIDER: ${{ github.event.inputs.provider || 'auto' }}

          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          # Optional model overrides. Leave unset to use the defaults
          # in news_llm.py.
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

          FMP_KEY: ${{ secrets.FMP_KEY }}

          # Keep this 0 so normal workflow runs actually notify.
          DRY_RUN: "0"

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          set -e
          python news_llm.py "${{ github.event.inputs.symbols }}"

      - name: Publish news log
        if: always()
        run: |
          git config user.name "swingbot"
          git config user.email "bot@users.noreply.github.com"

          git add news_log.csv docs/news.json || true

          if git diff --cached --quiet; then
            echo "No news output changes to commit."
            exit 0
          fi

          git commit -m "news: update news checks"

          # hourly-scan and this workflow both publish to main, so rebase
          # before pushing to avoid losing a newer main commit.
          git pull --rebase --autostash origin main

          git push || (
            sleep 5
            git pull --rebase --autostash origin main
            git push
          )
