name: fmp-check
# Standalone FMP data-availability diagnostic. Fully isolated from the
# live pipeline — only ever writes docs/fmp_check.json. Never touches
# watchlist.json, alerted.json, tickers.csv, or any nightly/hourly state.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers to check, e.g. GLD,SOXL,AAPL"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  fmp-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: Run FMP diagnostic
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}
        run: python fmp_check.py "${{ github.event.inputs.tickers }}"
      - name: Publish result
        run: |
          git config user.name swingbot && git config user.email bot@users.noreply.github.com
          git add docs/fmp_check.json || true
          if git diff --cached --quiet; then
            echo "nothing changed — no commit"
            exit 0
          fi
          git commit -m "fmp-check: update diagnostic"
          git pull --rebase --autostash origin main || true
          git push || (sleep 5 && git pull --rebase --autostash origin main && git push)
