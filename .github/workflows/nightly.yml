name: nightly-scan

on:
  schedule:
    # 22:30 UTC, Monday-Friday.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-scan
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh from main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check pandas numpy pyyaml

      - name: Run nightly watchlist
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}

          DRY_RUN: "0"

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          python nightly.py

      - name: Publish watchlist
        if: always()
        run: |
          git config user.name "swingbot"
          git config user.email "bot@users.noreply.github.com"

          git add watchlist.json

          if git diff --cached --quiet; then
            echo "No watchlist changes to commit."
            exit 0
          fi

          git commit -m "nightly: update watchlist"

          # Another workflow may have pushed to main while nightly was running.
          git pull --rebase --autostash origin main
          git push
