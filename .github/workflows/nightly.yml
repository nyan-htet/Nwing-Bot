name: nightly-scan

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-scan
  cancel-in-progress: false

jobs:

  # Stage 1: FMP screener only.
  # No financial statements. No Twelve Data time-series.
  stage1-universe:
    name: "1 — FMP universe funnel"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas numpy pyyaml

      - name: Stage 1 — FMP screener
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}
          NIGHTLY_DAILY_STOCK_CAP: "500"
        run: |
          set -e
          python -u nightly.py stage1

      - name: Save stage 1 state
        uses: actions/upload-artifact@v4
        with:
          name: nightly-stage1
          path: |
            nightly_stage1.json
            nightly_diagnostics.json
          if-no-files-found: error
          retention-days: 7


  # Stage 2: daily regime only for the <=500 stock survivors.
  stage2-daily:
    name: "2 — Twelve Data daily trim"
    needs: stage1-universe
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download stage 1 state
        uses: actions/download-artifact@v4
        with:
          name: nightly-stage1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas numpy pyyaml

      - name: Stage 2 — daily technical
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          NIGHTLY_DAILY_STOCK_CAP: "500"
        run: |
          set -e
          python -u nightly.py stage2

      - name: Save stage 2 state
        uses: actions/upload-artifact@v4
        with:
          name: nightly-stage2
          path: |
            nightly_stage2.json
            nightly_diagnostics.json
          if-no-files-found: error
          retention-days: 7


  # Stage 3: deeper 4H setup only for daily survivors.
  # 1H entry is deliberately NOT used here; hourly-scan owns entry timing.
  stage3-4h:
    name: "3 — Twelve Data 4H setup trim"
    needs: stage2-daily
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download stage 2 state
        uses: actions/download-artifact@v4
        with:
          name: nightly-stage2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas numpy pyyaml

      - name: Stage 3 — 4H setup
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          NIGHTLY_4H_STOCK_CAP: "150"
        run: |
          set -e
          python -u nightly.py stage3

      - name: Save stage 3 state
        uses: actions/upload-artifact@v4
        with:
          name: nightly-stage3
          path: |
            nightly_stage3.json
            nightly_diagnostics.json
          if-no-files-found: error
          retention-days: 7


  # Stage 4: only the final technical candidates get options/earnings context.
  stage4-context:
    name: "4 — Context + finalize"
    needs: stage3-4h
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download stage 3 state
        uses: actions/download-artifact@v4
        with:
          name: nightly-stage3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas numpy pyyaml

      - name: Stage 4 — context
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: |
          set -e
          python -u nightly.py stage4

      - name: Save final state
        uses: actions/upload-artifact@v4
        with:
          name: nightly-stage4
          path: |
            nightly_stage4.json
            watchlist.json
            nightly_diagnostics.json
          if-no-files-found: error
          retention-days: 7


  # Stage 5: notification/publication only.
  stage5-notify:
    name: "5 — Notify + publish"
    needs: stage4-context
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download final state
        uses: actions/download-artifact@v4
        with:
          name: nightly-stage4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas numpy pyyaml

      - name: Send nightly notification
        env:
          DRY_RUN: "0"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          python -u nightly.py stage5

      - name: Publish watchlist and diagnostics
        run: |
          set -e
          git config user.name "swingbot"
          git config user.email "bot@users.noreply.github.com"

          git add watchlist.json nightly_diagnostics.json

          if git diff --cached --quiet; then
            echo "No nightly output changes to commit."
            exit 0
          fi

          git commit -m "nightly: update watchlist and diagnostics"
          git pull --rebase --autostash origin main
          git push
