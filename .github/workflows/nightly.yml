name: nightly-scan

on:
  schedule:
    # 22:30 UTC, Monday-Friday.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-scan
  cancel-in-progress: false

jobs:
  # Stage 1: cheap bulk FMP funnel before any large Twelve Data work.
  stage1-fundamentals:
    name: "1 — FMP fundamental funnel"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas numpy pyyaml

      - name: Stage 1
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}
        run: python nightly.py stage1

      - name: Save stage 1 state
        uses: actions/upload-artifact@v4
        with:
          name: nightly-stage1
          path: nightly_stage1.json
          if-no-files-found: error
          retention-days: 1

  # Stage 2: only survivors from stage 1 hit Twelve Data daily endpoints.
  stage2-technical:
    name: "2 — Twelve Data technical trim"
    needs: stage1-fundamentals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download stage 1 state
        uses: actions/download-artifact@v4
        with:
          name: nightly-stage1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas numpy pyyaml

      - name: Stage 2
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
        run: python nightly.py stage2

      - name: Save stage 2 state
        uses: actions/upload-artifact@v4
        with:
          name: nightly-stage2
          path: nightly_stage2.json
          if-no-files-found: error
          retention-days: 1

  # Stage 3: expensive per-ticker context is applied only to the final list.
  stage3-context:
    name: "3 — Options + earnings context"
    needs: stage2-technical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download stage 2 state
        uses: actions/download-artifact@v4
        with:
          name: nightly-stage2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas numpy pyyaml

      - name: Stage 3
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}
        run: python nightly.py stage3

      - name: Save stage 3 state
        uses: actions/upload-artifact@v4
        with:
          name: nightly-stage3
          path: |
            nightly_stage3.json
            watchlist.json
          if-no-files-found: error
          retention-days: 1

  # Stage 4: notification + publication only. No API-heavy processing.
  stage4-publish:
    name: "4 — Notify + publish"
    needs: stage3-context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download final state
        uses: actions/download-artifact@v4
        with:
          name: nightly-stage3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas numpy pyyaml

      - name: Send nightly notification
        env:
          DRY_RUN: "0"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python nightly.py stage4

      - name: Publish watchlist
        run: |
          set -e
          git config user.name "swingbot"
          git config user.email "bot@users.noreply.github.com"
          git add watchlist.json
          if git diff --cached --quiet; then
            echo "No watchlist changes to commit."
            exit 0
          fi
          git commit -m "nightly: update watchlist"
          git pull --rebase --autostash origin main
          git push
