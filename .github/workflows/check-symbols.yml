name: check-symbols
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "empty = all csv | sp500 = only new category | or AAPL,MSFT list"
        required: false
        default: "sp500"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Probe Twelve Data symbols
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: python check_symbols.py "${{ github.event.inputs.mode }}"
