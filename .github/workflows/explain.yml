name: explain-ticker
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Ticker(s): GLD  |  GLD,SOXL,NVDA  |  watchlist  |  alerted"
        required: true
        default: "GLD"
permissions:
  contents: write
jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy pyyaml
      - name: Explain
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: python explain.py "${{ github.event.inputs.symbols }}"
      - name: Publish
        run: |
          git config user.name swingbot && git config user.email bot@users.noreply.github.com
          git add docs/explain.json docs/explain.html || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "explain: update diagnostics"
          git pull --rebase --autostash origin main || true
          git push || (sleep 5 && git pull --rebase --autostash origin main && git push)
