<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nwing-Bot — Why no signal?</title>
<style>
  :root { --bg:#0f1419; --card:#1a2129; --tx:#e6edf3; --mut:#8b98a5; --ok:#2ea043; --no:#da3633; --warn:#d29922; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:15px/1.55 -apple-system,Segoe UI,Roboto,sans-serif; padding:16px; max-width:900px; margin:auto; }
  h1 { font-size:1.3rem; } h2 { font-size:1rem; margin:20px 0 8px; }
  .mut { color:var(--mut); font-size:.85rem; }
  .card { background:var(--card); border-radius:10px; padding:14px; margin:12px 0; border-left:4px solid var(--no); }
  .card.pass { border-left-color:var(--ok); }
  .head { font-size:1.05rem; font-weight:600; }
  .gate { display:flex; gap:8px; align-items:flex-start; padding:4px 0; font-size:.87rem; border-bottom:1px solid #30363d; }
  .tag { flex:0 0 46px; font-weight:700; font-size:.75rem; padding-top:2px; }
  .tag.y { color:var(--ok); } .tag.n { color:var(--no); }
  .gname { flex:0 0 110px; color:var(--mut); }
  .why { margin-top:8px; padding:8px; background:#0d1117; border-radius:6px; font-size:.87rem; }
  .muted { color:var(--warn); font-size:.83rem; margin:4px 0; }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:.72rem; background:#21309a33; margin-left:6px; }
  table { width:100%; border-collapse:collapse; font-size:.82rem; margin-top:6px; }
  td { padding:3px 6px; border-bottom:1px solid #30363d; }
  summary { cursor:pointer; color:var(--mut); font-size:.85rem; margin-top:6px; }
  a { color:#58a6ff; }
  .summary-box { background:var(--card); border-radius:10px; padding:12px; }
</style>
</head>
<body>
<h1>🔍 Why no signal?</h1>
<div class="mut" id="meta">Loading…</div>

<h2>Where they stopped</h2>
<div class="summary-box" id="summary"></div>

<h2>Detail</h2>
<div id="list"></div>

<p class="mut" style="margin-top:20px">
  <a href="index.html">← signals</a> ·
  <a href="backtest.html">backtest</a> ·
  <a href="backtest_v2.html">backtest v2</a><br>
  Run the <b>explain-ticker</b> workflow with a ticker, a comma list,
  <code>watchlist</code>, or <code>alerted</code> to refresh this page.
</p>

<script>
const $ = id => document.getElementById(id);

function gateRow(g) {
  return `<div class="gate"><span class="tag ${g.pass ? "y" : "n"}">${g.pass ? "PASS" : "FAIL"}</span>
    <span class="gname">${g.gate}</span><span>${g.detail}</span></div>`;
}

function qualityTable(q) {
  if (!q) return "";
  const rows = Object.keys(q.detail || {}).map(k => {
    const v = q.detail[k];
    const col = v >= 0.5 ? "#2ea043" : v > -0.2 ? "#8b98a5" : "#da3633";
    return `<tr><td style="width:130px">${k}</td>
      <td style="color:${col};width:55px">${v > 0 ? "+" : ""}${v.toFixed(2)}</td>
      <td class="mut">${(q.notes || {})[k] || ""}</td></tr>`;
  }).join("");
  return `<details><summary>Quality breakdown (${q.total} vs floor ${q.floor})</summary>
    <table>${rows}</table></details>`;
}

fetch("explain.json?t=" + Date.now()).then(r => r.json()).then(d => {
  $("meta").textContent = "Generated " + String(d.generated).slice(0, 16).replace("T", " ") + " UTC";

  const counts = {};
  (d.results || []).forEach(r => {
    const k = r.stopped_at || "would alert";
    counts[k] = (counts[k] || 0) + 1;
  });
  const total = (d.results || []).length;
  $("summary").innerHTML = Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([k, v]) => {
      const pct = Math.round(v / total * 100);
      const col = k === "would alert" ? "#2ea043" : "#8b98a5";
      return `<div style="margin:4px 0"><b style="color:${col}">${v}</b> — ${k}
        <div style="background:${col};height:8px;width:${pct}%;border-radius:3px;margin-top:2px"></div></div>`;
    }).join("");

  $("list").innerHTML = (d.results || []).map(r => {
    const passed = !r.stopped_at;
    const wa = r.would_alert;
    return `<div class="card ${passed ? "pass" : ""}">
      <div class="head">${r.ticker}${r.name ? " — " + r.name : ""}
        ${r.price ? `<span class="pill">$${r.price}</span>` : ""}
        ${r.sector ? `<span class="pill">${r.sector}</span>` : ""}</div>
      ${r.muted ? `<div class="muted">🔇 muted — alerted ${r.muted.alerted} at $${r.muted.entry},
         target $${r.muted.tp}${r.muted.thesis_warned ? " · thesis already flagged" : ""}</div>` : ""}
      ${(r.gates || []).map(gateRow).join("")}
      ${qualityTable(r.quality)}
      ${wa ? `<div class="why">✅ Would alert: entry $${wa.entry} → TP $${wa.tp}
         (+${wa.tp_pct}%), ${wa.shares} units ≈ $${wa.value}</div>`
           : `<div class="why">${r.why || ""}</div>`}
    </div>`;
  }).join("");
}).catch(() => $("meta").textContent = "No explain.json yet — run the explain-ticker workflow.");
</script>
</body>
</html>
