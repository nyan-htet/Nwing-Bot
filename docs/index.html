<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nwing-Bot — Signals</title>
<style>
  :root { --bg:#0f1419; --card:#1a2129; --tx:#e6edf3; --mut:#8b98a5; --acc:#2ea043; --warn:#d29922; --neg:#da3633; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:15px/1.55 -apple-system,Segoe UI,Roboto,sans-serif; padding:16px; max-width:880px; margin:auto; }
  h1 { font-size:1.35rem; margin-bottom:4px; } h2 { font-size:1.05rem; margin:22px 0 8px; }
  .mut { color:var(--mut); font-size:.85rem; }
  .card { background:var(--card); border-radius:10px; padding:14px; margin:10px 0; }
  .sig { border-left:4px solid var(--acc); }
  .pos { border-left:4px solid var(--warn); }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:.75rem; background:#21309a33; margin-left:4px; }
  .big { font-size:1.05rem; font-weight:600; margin:6px 0; }
  .tp { color:var(--acc); font-weight:700; }
  .warnbox { color:var(--warn); font-size:.85rem; margin-top:6px; }
  table { width:100%; border-collapse:collapse; font-size:.82rem; margin-top:6px; }
  td { padding:4px 6px; border-bottom:1px solid #30363d; vertical-align:top; }
  summary { cursor:pointer; }
  a { color:#58a6ff; }
</style>
</head>
<body>
<h1>📈 Nwing-Bot</h1>
<div class="mut" id="meta">Loading…</div>

<h2>Current signals</h2>
<div id="signals"></div>

<h2>Position alerts</h2>
<div id="posalerts"></div>

<p class="mut" style="margin-top:24px">
  <a href="backtest.html">Backtest results →</a><br>
  Signals are decision support, not financial advice. Each ticker alerts once
  and stays muted until its target is exceeded.
</p>

<script>
const $ = id => document.getElementById(id);
let tickerMeta = {};

function parseCsv(text) {
  const lines = text.trim().split("\n");
  const head = lines[0].split(",").map(s => s.trim().toLowerCase());
  const out = {};
  for (let i = 1; i < lines.length; i++) {
    const cells = lines[i].split(",");
    const row = {};
    head.forEach((k, j) => row[k] = (cells[j] || "").trim());
    if (row.symbol) out[row.symbol.toUpperCase()] = row;
  }
  return out;
}

const repoPath = () => location.hostname.split(".")[0] + "/" + location.pathname.split("/")[1];

async function loadTickerMeta() {
  for (const u of ["https://raw.githubusercontent.com/" + repoPath() + "/main/tickers.csv?t=" + Date.now(),
                   "../tickers.csv?t=" + Date.now()]) {
    try {
      const r = await fetch(u);
      if (!r.ok) continue;
      tickerMeta = parseCsv(await r.text());
      if (Object.keys(tickerMeta).length) return;
    } catch (e) {}
  }
}

const FACTORS = [["RSI momentum","rsi"],["Bollinger Bands","bollinger"],["VWAP","vwap"],
                 ["Volume","volume"],["Extension from EMA","extension"]];

function card(s) {
  const m = tickerMeta[s.ticker.toUpperCase()] || {};
  const name = s.name || m.name || m.note || "";
  const pl = (s.pl_amount != null) ? s.pl_amount : (s.tp - s.entry) * s.shares;
  const factors = FACTORS.map(([label, key]) => {
    const v = s.q_detail ? s.q_detail[key] : undefined;
    if (v === undefined) return "";
    const note = s.q_notes ? (s.q_notes[key] || "") : "";
    const col = v === undefined ? "var(--mut)" : (v >= 0.5 ? "#2ea043" : v > -0.2 ? "#8b98a5" : "#da3633");
    return `<tr><td style="width:150px">${label}</td>
      <td style="color:${col};width:55px">${v === undefined ? "–" : (v > 0 ? "+" : "") + v.toFixed(1)}</td>
      <td class="mut">${note}</td></tr>`;
  }).join("");

  return `<div class="card sig">
    <div class="big">${s.ticker}${name ? " — " + name : ""}
      <span class="pill">${s.setup}</span>${s.new_leg ? '<span class="pill">new leg</span>' : ""}</div>
    <div>Entry $${s.entry} → <span class="tp">TP $${s.tp} (+${(s.tp_pct * 100).toFixed(1)}%)</span>
      &nbsp;·&nbsp; ${s.shares} units ≈ $${Math.round(s.value)}</div>
    <div class="mut">Time frame: ${s.eta_days_low ? s.eta_days_low + "-" + s.eta_days_high + " trading days (estimate from ATR + MA pace)" : "not estimable"}</div>
    <div class="big">eToro Take Profit → P/L amount: <span class="tp">$${pl.toFixed(2)}</span></div>
    <div class="mut"><b>Daily regime:</b> ${(s.regime || "?").toUpperCase()} for ~${s.regime_weeks ?? "?"} weeks${
      s.above_ema200 === true ? " • above 200 EMA" : s.above_ema200 === false ? " • below 200 EMA" : ""}</div>
    <div class="mut"><b>Trend:</b> ${s.trend_score}/5${s.runner ? " ⭐RUNNER" : ""} • ADX ${s.adx}
      • RS vs SPY ${(s.rs * 100).toFixed(1)}% • RSI(4h) ${s.rsi ?? "?"} • quality ${s.quality ?? "?"}</div>
    <div class="mut"><b>EMAs:</b> 20 $${s.ema20 ?? "?"} | 50 $${s.ema50 ?? "?"} | 200 $${s.ema200 ?? "?"}</div>
    ${(s.warnings && s.warnings.length) ? `<div class="warnbox">${s.warnings.join("<br>")}</div>` : ""}
    <details><summary class="mut">Why this score?</summary><table>${factors}</table></details>
  </div>`;
}

async function load() {
  await loadTickerMeta();
  try {
    const d = await (await fetch("signals.json?t=" + Date.now())).json();
    $("meta").innerHTML = `Last scan ${String(d.generated).slice(0, 16).replace("T", " ")} UTC`
      + ` • Macro: ${d.macro?.risk || "?"} (SPY 20d vol ${d.macro?.vol ?? "?"}%)`
      + `<br><span class="mut">${d.cycles?.line || ""}</span>`;
    const sigs = d.signals || [];
    $("signals").innerHTML = sigs.length ? sigs.map(card).join("")
      : "<div class='mut'>No active signals right now. Tickers already alerted stay muted until they clear their target.</div>";
    $("posalerts").innerHTML = (d.position_alerts && d.position_alerts.length)
      ? d.position_alerts.map(m => `<div class="card pos">${m}</div>`).join("")
      : "<div class='mut'>None.</div>";
  } catch (e) {
    $("meta").textContent = "No signals.json yet — run a scan first.";
  }
}
load();
</script>
</body>
</html>
