<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nwing-Bot — FMP data check</title>
<style>
  :root { --bg:#0f1419; --card:#1a2129; --tx:#e6edf3; --mut:#8b98a5; --ok:#2ea043; --no:#da3633; --warn:#d29922; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:15px/1.55 -apple-system,Segoe UI,Roboto,sans-serif; padding:16px; max-width:900px; margin:auto; }
  h1 { font-size:1.3rem; } h2 { font-size:1rem; margin:20px 0 8px; }
  .mut { color:var(--mut); font-size:.85rem; }
  .card { background:var(--card); border-radius:10px; padding:14px; margin:12px 0; border-left:4px solid var(--mut); }
  .card.ok { border-left-color:var(--ok); }
  .card.bad { border-left-color:var(--no); }
  .head { font-size:1.05rem; font-weight:600; }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:.72rem; background:#21309a33; margin-left:6px; }
  .step { display:flex; gap:8px; align-items:flex-start; padding:4px 0; font-size:.87rem; border-bottom:1px solid #30363d; }
  .tag { flex:0 0 46px; font-weight:700; font-size:.75rem; padding-top:2px; }
  .tag.PASS { color:var(--ok); } .tag.FAIL { color:var(--no); } .tag.WARN { color:var(--warn); }
  .sname { flex:0 0 190px; color:var(--mut); }
  .diagnosis { margin-top:10px; padding:10px; background:#0d1117; border-radius:6px; font-size:.87rem; }
  a { color:#58a6ff; }
</style>
</head>
<body>
<h1>🔧 FMP data-availability check</h1>
<div class="mut" id="meta">Loading…</div>

<div id="list"></div>

<p class="mut" style="margin-top:20px">
  <a href="index.html">← signals</a> ·
  <a href="explain.html">explain</a> ·
  <a href="backtest.html">backtest</a><br>
  Run the <b>fmp-check</b> workflow with a comma-separated ticker list to
  refresh this page. Fully isolated — never touches the live pipeline's
  watchlist, alerted ledger, or universe file.
</p>

<script>
const $ = id => document.getElementById(id);

function stepRow(s) {
  return `<div class="step"><span class="tag ${s.status}">${s.status}</span>
    <span class="sname">${s.step}</span><span>${s.detail}</span></div>`;
}

fetch("fmp_check.json?t=" + Date.now()).then(r => r.json()).then(d => {
  $("meta").textContent = `Checked ${d.tickers_checked.join(", ")} • generated ${d.generated?.slice(0,19).replace("T"," ")} UTC`;

  $("list").innerHTML = d.results.map(r => {
    const anyFail = r.steps.some(s => s.status === "FAIL");
    const cls = anyFail ? "bad" : "ok";
    return `<div class="card ${cls}">
      <div class="head">${r.ticker}
        ${r.type ? `<span class="pill">${r.type}</span>` : ""}
        ${r.in_universe ? "" : `<span class="pill">not in tickers.csv</span>`}
      </div>
      ${r.steps.map(stepRow).join("")}
      <div class="diagnosis">🩺 ${r.diagnosis}</div>
    </div>`;
  }).join("");
}).catch(e => $("meta").textContent = "No fmp_check.json yet — run the fmp-check workflow.");
</script>
</body>
</html>
